name: SO-101 dashboard offline

on:
  pull_request:
    paths:
      - 'projects/so101-arm/**'
      - '.github/workflows/so101-arm-offline.yml'
  push:
    paths:
      - 'projects/so101-arm/**'
      - '.github/workflows/so101-arm-offline.yml'

permissions:
  contents: read

jobs:
  dashboard-unit:
    name: Dashboard-owned unit (no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dashboard test dependencies
        run: pip install pillow
      - name: Dashboard HTTP, UI, lifecycle, camera and legacy guards
        env:
          SO101_DASHBOARD_TEST_MODE: unit
        run: python3 projects/so101-arm/test_vehicle_dashboard.py
      - name: Legacy canonical authority guards
        run: python3 projects/so101-arm/test_legacy_authority.py
      - name: JavaScript syntax
        run: sed -n '/<script>/,/<\/script>/p' projects/so101-arm/panel.html | sed '1d;$d' | node --check -
      - name: Dashboard build check
        run: |
          python3 dash.py so101-arm all
          python3 dash.py so101-arm check
      - name: Legacy shell syntax
        run: |
          bash -n projects/so101-arm/tools/run_demo.sh
          bash -n projects/so101-arm/tools/sim/restart_viewer.sh
          sh -n projects/so101-arm/tools/usb_port_cycle.sh

  canonical-integration:
    name: Canonical integration (public source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout public canonical repository
        uses: actions/checkout@v4
        with:
          repository: mmporong/so101-mobile-manipulation
          path: so101-mobile-manipulation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install integration dependencies
        run: pip install numpy opencv-python-headless pillow
      - name: Run against actual canonical code
        env:
          SO101_DASHBOARD_TEST_MODE: integration
          SO101_CANONICAL_DIR: ${{ github.workspace }}/so101-mobile-manipulation
        run: python3 projects/so101-arm/test_vehicle_dashboard.py
